# Netlify — Jalur A (frontend statis only).
# Connect repo → Build command & Publish dir otomatis dari sini.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback tidak perlu (single index.html), tapi header cache buat aset hemat bandwidth.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
